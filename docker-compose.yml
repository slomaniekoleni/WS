# Secrets (Claude API key, Telegram token, admin login) go in .env next to this file (gitignored), see .env.example.
#   Local site only:            docker compose up -d --build            -> http://localhost:8080
#   Public demo (quick tunnel): docker compose --profile tunnel up -d --build
#   Public demo (own domain):   docker compose --profile named-tunnel up -d --build   (needs TUNNEL_TOKEN in .env)
#   Public demo (Tailscale):    docker compose --profile tailscale up -d --build      (needs TS_AUTHKEY in .env)
# Or run scripts/demo.ps1: picks Tailscale / named tunnel / quick tunnel from what's in .env and prints the URL.
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      # Localhost only: from outside the app is reachable just through the tunnel.
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Real visitor IP (rate limits, logs): Cloudflare and Tailscale both append it as the last X-Forwarded-For entry.
      # Safe because the port above isn't exposed to the network.
      Ws__ForwardedIpHeader: X-Forwarded-For
    volumes:
      - ws-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q ok <&3'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Cloudflare quick tunnel: free random https://*.trycloudflare.com URL, no account. The URL changes on every restart.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:8080
    depends_on:
      api:
        condition: service_healthy

  # Named tunnel on your own domain (stable URL): create it in the Cloudflare dashboard (Zero Trust > Networks > Tunnels),
  # point its public hostname to http://api:8080 and put the token in .env as TUNNEL_TOKEN.
  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [named-tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

  # Tailscale Funnel: free, stable https://<TS_HOSTNAME>.<tailnet>.ts.net, not routed through Cloudflare.
  # Needs a Tailscale account with HTTPS certificates enabled and an auth key (TS_AUTHKEY in .env).
  tailscale:
    image: tailscale/tailscale:latest
    profiles: [tailscale]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-wisecity}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-wisecity}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  ws-data:
  ts-state:
